services:
  watchdog:
    image: akashpanja/watchdog:latest
    # To build from source instead, comment out `image:` and uncomment:
    # build: .
    container_name: watchdog
    restart: unless-stopped
    ports:
      - "${WATCHDOG_PORT:-8099}:8099"
    environment:
      APP_USERNAME: ${APP_USERNAME:?set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MOTION_THRESHOLD: ${MOTION_THRESHOLD:-0.02}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
